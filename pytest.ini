[pytest]
testpaths = tests

# o PyMuPDF dispara uns DeprecationWarning internos ("builtin type SwigPyObject
# has no __module__ attribute" e parentes) no Python 3.12. Nao sao nossos e nao
# tem o que fazer com eles, entao ficam escondidos.
filterwarnings =
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
